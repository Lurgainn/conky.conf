-- Expand '~' (home) into full path
local function expandHome(path)
    local home_dir

    --***** DEBUG
    if DEBUG then print('DEBUG conky.conf: function expandHome(path) executed.') end
    if string.sub(path, 1, 2) == '~/' then
        home_dir = os.getenv("HOME")
        -- If path start with ~/
        if home_dir then
            return home_dir .. string.sub(path, 2)
        else
            -- If ENV variable HOME isn't set, then return original path
            return path
        end
    else
        -- If path not start with '~', then return original path
        return path
    end
end

-- Return the absolute path of config directory
local function getConfigDirFullPath()
    --***** DEBUG
    if DEBUG then print('DEBUG conky.conf: function getConfigDirFullPath() executed.') end
    return expandHome(CONFIG_PATH)
end

-- Prepare the kernel's string
local function getFullKernelString()
	local f
	local myos = ''
	local mykernel = ''

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getFullKernelString() executed.') end
	-- Get kernel name
	f = io.popen(GET_KERNEL_NAME_CMD)
	if f ~= nil then
		myos = f:read('*a')
		f:close()
		-- Remove '\n'
		myos = myos:gsub('\n', '')
	end
	-- Get kernel release
	f = io.popen(GET_KERNEL_RELEASE_CMD)
	if f ~= nil then
		mykernel = f:read('*a')
		f:close()
		-- Remove '\n'
		mykernel = mykernel:gsub('\n', '')
	end
	-- Return the final string
	return '${color1}${alignc}${font1}' .. myos .. ' ' .. mykernel .. '\n'
end

-- Prepare the distro's descrition string
local function getFullDistroString()
	local f
	local mydistro = ''
	local mydistroname = ''

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getFullDistroString() executed.') end
	-- Get the short description of the distro
	f = io.popen(GET_DISTRO_DESC_CMD)
	if f ~= nil then
		mydistro = f:read('*a')
		f:close()
		-- Remove '\n'
		mydistro = mydistro:gsub('\n', '')
	end
	-- Get the codename of the release
	f = io.popen(GET_DISTRO_NAME_CMD)
	if f ~= nil then
		mydistroname = f:read('*a')
		f:close()
		-- Remove '\n'
		mydistroname = mydistroname:gsub('\n', '')
	end
	-- Return the final string
	return '${color1}${alignc}${font1}' .. mydistro .. ' ' .. mydistroname .. '\n'
end

-- Get the numbre of CPUs
local function getCpuNum()
	local f
	local num = 0

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getCpuNum() executed.') end
	-- Get the number of installed cores
	f = io.popen(NUM_CORES_CMD)
	if f ~= nil then
		num = f:read('*a')
		f:close()
		-- Remove '\n'
		num = num:gsub('\n', '')
	end
	-- Return the number
	return tonumber(num)
end

-- Create the CPUs string
local function getFullCpuString()
	local loopstart
	local loopend
	local output

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getFullCpuString() executed.') end
	-- Prepare for the loop
	output = ''
	loopstart = 1
	-- Main loop for all cores
	while loopstart <= cpu_num do
		-- Prepare for secondary loops (blocks of 8 CPU)
		loopend = loopstart + 7
		if loopend > cpu_num then
			loopend = cpu_num
		end
		-- Headers
		output = output .. '${color2}${alignc}${font3}'
		for k = loopstart, loopend, 1 do
			if k == loopend then
				output = output .. 'C.' .. string.format('%02d', k) .. '\n'
			else
				output = output .. 'C.' .. string.format('%02d', k) .. ' '
			end
		end
		-- Frequencies
		output = output .. '${color0}${alignc}${font3}'
		for k = loopstart, loopend, 1 do
			if k == loopend then
				output = output .. '${freq_g ' .. k .. '}\n'
			else
				output = output .. '${freq_g ' .. k .. '} '
			end
		end
		-- Usage
		output = output .. '${color0}${alignc}${font3}'
		for k = loopstart, loopend, 1 do
			if k == loopend then
				output = output .. '${cpugauge cpu' .. k .. ' 14,27}\n'
			else
				output = output .. '${cpugauge cpu' .. k .. ' 14,27}  '
			end
		end
		loopstart = loopend + 1
	end
	return output
end

-- Create a table with all  found hwmon
local function getHwmonDirs()
	local results = {}
	local hwmon_dir = ''
	local i = 0
	local f
	local name_file = ''
	local name_content = ''

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getHwmonDirs() executed.') end
	-- Exit from loop when exausted hwmon directories
	while true do
		-- Analyze all 'hwmon' directories
		hwmon_dir = HWMON_ROOT .. HWMON_DIRS_HEAD .. i
		-- Look for a file 'name' inside every hwmon dir
		name_file = hwmon_dir .. HWMON_NAME_FILE
		f = io.open(name_file, 'r')
		if f then
			-- Get type of 'hwmon'
			name_content = f:read('*a')
			f:close()
			-- Remove '\n'
			name_content = name_content:gsub('\n', '')
			-- Insert into results
			table.insert(results, {i, name_content})
		else
			-- Exausted 'hwmon' directories
			break
		end
		-- Next 'hwmon' directory
		i = i + 1
	end
	return results
end

-- Find all core temps in hwmon
local function findAllCoresTemp()
	local cores_found = {}
	local i = 1
	local core_temp_file = ''
	local f
	local label_content = ''

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function findAllCoresTemp() executed.') end
	-- Analyze all 'hwmon' found
	for _, row in ipairs(hwmon_dirs_found) do
		-- Look for CORES_TEMP_LOOK_FOR
		if row[2] == CORES_TEMP_LOOK_FOR then
			-- Look for all CORE_TEMP_NAME
			i = 1
			while true do
				core_temp_file = HWMON_ROOT .. HWMON_DIRS_HEAD .. row[1] .. CORE_TEMP_HEAD .. i .. CORE_TEMP_TAIL
				f = io.open(core_temp_file, 'r')
				if f then
					label_content = f:read('*a')
					f:close()
					if string.find(label_content, CORE_TEMP_NAME) then
						-- Found a core temp
						table.insert(cores_found, {row[1], i})
					end
				else
					-- Exausted all cores temperatures
					break
				end
				i = i + 1
			end
		end
	end
	return cores_found
end

-- Create the core's temp string
local function getCoreTempString()
	local output = ''
	local core_temp_count = 0
	local loop = 1
	local k = 1

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getCoreTempString() executed.') end
	-- Count cores temp found
	for _, row in ipairs(hwmon_cores_temp) do
		core_temp_count = core_temp_count + 1
	end
	if core_temp_count == 0 then
		-- No cores temp found
		return ''
	end
	-- Main loop for all cores temp
	for _, row in ipairs(hwmon_cores_temp) do
		if k == 1 then
			output = output .. '${alignc}'
		end
		output = output .. '${color2}C.' .. string.format('%02d', loop) .. ': '
		output = output .. '${color0}${hwmon ' .. row[1] .. ' temp ' .. row[2] .. '}°'
		if k == 4 then
			output = output .. '\n'
			k = 1
		else
			output = output .. ' '
			k = k + 1
		end
		loop = loop + 1
	end
	return output
end

-- Find all fans and create a table
local function findAllFans()
	local results = {}
	local i = 0
	local fan_num
	local fan_file
	local f
	local content

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function findAllFans() executed.') end
	-- Analyze all 'hwmon' found
	for _, row in ipairs(hwmon_dirs_found) do
		-- Search for fans in every hwmon directory
		fan_num = 1
		while true do
			fan_file = HWMON_ROOT .. HWMON_DIRS_HEAD .. row[1] .. '/' .. FAN_HEAD .. fan_num .. FAN_TAIL
			f = io.open(fan_file, 'r')
			if f then
				content = f:read('*a')
				f:close()
				-- Check if <> 0
				if content then
					content = content:gsub('\n', '')
					if content ~= '0' then
						table.insert(results, {i, fan_num})
					end
				end
			else
				-- No more fans in this directory
				break
			end
			-- Next fan
			fan_num = fan_num + 1
		end
		-- Next hwmon directory
		i = i + 1
	end

	table.sort(results, function(a, b)
		if a[1] ~= b[1]
		then
			return a[1] < b[1]
		else
			return a[2] < b[2]
		end
	end)
	return results
end

-- Create a all fans string
local function getAllFansString()
	local output = ''
	local hwmon_number
	local fan_number
	local counter = 1
	local fancounter = 1

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getAllFansString() executed.') end
	-- Get all values in the table of fans
	for _, row in ipairs(hwmon_all_fans) do
		-- Get hwmon and fan numbers
		hwmon_number = row[1]
		fan_number = row[2]
		-- Max 3 values in a single row
		if counter == 1 then
			output = output .. '${alignc}${color2}' .. 'FAN' .. fancounter .. ': ${color0}${hwmon ' .. hwmon_number .. ' fan ' .. fan_number .. '}'
		elseif counter == 2 then
			output = output .. '${color2} - FAN' .. fancounter .. ': ${color0}${hwmon ' .. hwmon_number .. ' fan ' .. fan_number .. '}'
		else
			output = output .. '${color2} - FAN' .. fancounter .. ': ${color0}${hwmon ' .. hwmon_number .. ' fan ' .. fan_number .. '}\n'
		end
		-- Update the counters
		fancounter = fancounter + 1
		counter = counter + 1
		if counter > 3 then
			counter = 1
		end
	end
	if string.sub(output, -1) ~= '\n' then
		output = output .. '\n'
	end
	return output
end

-- Get SATA device's name
local function getSataName(hwmon_dir)
	local dev_dir = ''
	local i = 0
	local hd_name = ''

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getSataName(hwmon_dir) executed.') end
	-- Enter the folder
	dev_dir = hwmon_dir .. HARD_DISK_DEVICE_FOLDER .. HARD_DISK_SATA_NAME_BY_FOLDER
	if (lfs.attributes(dev_dir, 'mode') == 'directory') then
		-- Get device name is one dir only
		i = 0
		for f in lfs.dir(dev_dir) do
			if f ~= '.' and f ~= '..' then
				i = i + 1
				hd_name = f
			end
		end
		if i > 1 then
			hd_name = 'SATA??'
		end
	end
	return hd_name
end

-- Get NVME device's name
local function getNvmeName(hwmon_dir)
	local dev_dir = ''
	local i = 0
	local hd_name = ''

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getNvmeName(hwmon_dir) executed.') end
	-- Enter the folder
	dev_dir = hwmon_dir .. HARD_DISK_DEVICE_FOLDER
	if (lfs.attributes(dev_dir, 'mode') == 'directory') then
		i = 0
		for entry in lfs.dir(dev_dir) do
			if (string.sub(entry, 1, 4) == HARD_DISK_TEST_NVME) and (lfs.attributes(dev_dir .. '/' .. entry, 'mode') == 'directory') then
				i = i + 1
				hd_name = entry
				break
			end
		end
		if i > 1 then
			hd_name = 'NVME??'
		end
	end
	return hd_name
end

-- Find all hwmon temperature of hard-disks
local function findHdTemp()
	local results = {}
	local i = 0
	local hwmon_dir = ''
	local name_file
	local hd_name

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function findHdTemp() executed.') end
	-- Analyze all 'kernel driver's names'
	for _, row1 in ipairs(HARD_DISK_TEMP_LOOK_FOR) do
		-- Analyze all 'hwmon' found
		for _, row2 in ipairs(hwmon_dirs_found) do
			-- Look for driver name
			if row1 == row2[2] then
				-- Get device name (NVME or SATA)
				hwmon_dir = HWMON_ROOT .. HWMON_DIRS_HEAD .. row2[1]
				if row1 == HARD_DISK_TEST_NVME then
					hd_name = getNvmeName(hwmon_dir)
				else
					hd_name = getSataName(hwmon_dir)
				end
				-- Now get all temps in this hwmon
				hd_name = string.upper(hd_name)
				i = 0
				while true do
					i = i + 1
					name_file = hwmon_dir .. HARD_DISK_TEMP_HEAD .. i .. HARD_DISK_TEMP_TAIL
					if (lfs.attributes(name_file, 'mode') == 'file') then
						table.insert(results, {hd_name, row2[1], i})
					else
						break
					end
				end
			end
		end
	end
	-- Riordina i valori
	table.sort(results, function(a, b)
		-- Compare by the first value (hd_name)
		if a[1] ~= b[1] then
		  return a[1] < b[1]
		end
		-- If the first values are equal, compare by the second value (row2[1])
		if a[2] ~= b[2] then
		  return a[2] < b[2]
		end
		-- If both the first and second values are equal, compare by the third value (i)
		return a[3] < b[3]
	  end)
	return results
end

-- Create hard-disks temperature string
local function getHdTempString()
	local output = ''
	local counter = 1

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getHdTempString() executed.') end
	-- Get all values in the table of fans
	for _, row in ipairs(hwmon_hd_temp) do
		if counter == 1 then
			output = output .. '${alignc}${color2}' .. row[1] .. ': ${color0}${hwmon ' .. row[2] .. ' temp ' .. row[3] .. '}°'
		elseif counter == 2 then
			output = output .. '${color2} - ' .. row[1] .. ': ${color0}${hwmon ' .. row[2] .. ' temp ' .. row[3] .. '}°'
		else
			output = output .. '${color2} - ' .. row[1] .. ': ${color0}${hwmon ' .. row[2] .. ' temp ' .. row[3] .. '}°\n'
		end
		-- Update the counter
		counter = counter + 1
		if counter > 3 then
			counter = 1
		end
	end
	-- Check for '\n' as last character
	if output:sub(-1) ~= '\n' then
		output = output .. '\n'
	end
	return output
end

-- Get a table with all internal mounted points
local function findMountPoints()
	local f
	local file_systems = ''
	local first = true
	local mounted_paths = {}

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function findMountPoints() executed.') end
	-- Get all real filesystems
	f = io.popen(FIND_FILESYSTEMS)
	if f ~= nil then
		file_systems = f:read('*a')
		f:close()
		-- Get all important lines but first
		for line in string.gmatch(file_systems, "[^\n]+") do
			if first then
				first = false
			elseif line ~= "" then
				table.insert(mounted_paths, line)
			end
		end
	end
	return mounted_paths
end

-- Get all internal filesystems
local function findFsInternalOrdered()
	local output = {}
	local len = 0

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function findFsInternalOrdered() executed.') end
	-- Now set the mount points order
	for _, row1 in ipairs(FS_INTERNAL_ORDERED) do
		for _, row2 in ipairs(internal_mount_points) do
			if row2:find(row1 .. '$') then
				table.insert(output, {row1, row2})
			end
		end
	end
	-- Now get max length of names
	for _, row1 in ipairs(output) do
		if string.len(row1[1]) > len then
			len = string.len(row1[1])
		end
	end
	-- And now add the spaces
	for _, row1 in ipairs(output) do
		if string.len(row1[1]) < len then
			row1[1] = string.rep(' ', len - string.len(row1[1])) .. row1[1]
		end
	end
	return output
end

-- Create the string parameter for conky.lua
local function getFsInternalForLua()
	local output = ''
	local count = 1

	-- Get all internal mount points
	for _, row1 in ipairs(fs_internal) do
		if count > 1 then
			output = output .. MOUNT_POINTS_SEPARATOR
		end
		output = output .. row1[2]
		count = count + 1
	end
	return output
end

-- Create the internal filesystems string
local function getFsInternalString()
	local output = ''

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getFsInternalString() executed.') end
	-- Get all mount points
	for _, row in ipairs(fs_internal) do
		output = output .. '${color2}' .. row[1] .. ':${alignc}${color0} ${fs_free ' .. row[2] .. '} on ${fs_size ' .. row[2] .. '} ${alignr}${color3}${fs_bar_free 8,150 ' .. row[2] .. '}\n'
	end
	return output
end

-- Get all real networks
local function getAllNetworks()
	local results = {}
	local f

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getAllNetworks() executed.') end
	-- Get all networks
	f = io.popen(NETWORKS_LIST)
	if f ~= nil then
		for temp in f:lines() do
			-- Exlude 'lo' and 'vir...'
			if (temp ~= 'lo') and not (string.sub(temp, 1, 3) == 'vir') then
				table.insert(results, temp)
			end
		end
		-- Sort the table
		table.sort(results)
	end
	return results
end

-- Create ther networks string
local function getNetworksString()
	local output = ''

	--***** DEBUG
	if DEBUG then print('DEBUG conky.conf: Function getNetworksString() executed.') end
	-- Get all networks
	for _, row in ipairs(real_networks) do
		output = output .. '${color2}' .. row .. '-${font3}${voffset -1}${addr ' .. row .. '}${font1}${voffset -3}: D.▼ ${color0}${downspeed ' .. row .. '}${color2}${goto 340}U.▲ ${color0}${upspeed ' .. row .. '}\n'
	end
	return output
end

